name: Bug report
description: PrufGate crashed, gave a wrong result, or does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "This repository is public. Do not paste private code, secrets, tokens, hostnames or paths from your machine. Reproduce with a small invented example. Report security problems privately (Security tab), not here."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran and a minimal invented code sample.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PrufGate version (`prufgate --version` or commit), Python version, OS
    validations:
      required: true
