name: Fuzz

# ClusterFuzzLite runs the fuzz targets in fuzz/ against the code a pull
# request changes. Read-only: crashes are reported in the job log.
on:
  pull_request:
    paths:
      - 'prufgate/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - 'requirements.txt'

permissions: {}

concurrency:
  group: fuzz-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz the changed code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # reuse the corpus and coverage stored as artifacts by earlier runs
    steps:
      - name: Build the fuzz targets
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
      - name: Run the fuzz targets
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          mode: code-change
          sanitizer: address
          fuzz-seconds: 300
